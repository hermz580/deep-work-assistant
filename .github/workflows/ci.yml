name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run readiness contract
        run: python -m deep_work_assistant doctor --json
      - name: Run deterministic simulation
        run: python -m deep_work_assistant simulate
      - name: Build wheel and source archive
        run: python -m build
